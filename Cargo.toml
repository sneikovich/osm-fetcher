[package]
name = "overpass"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
wiremock = "0.6.5"


