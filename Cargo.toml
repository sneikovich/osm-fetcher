[package]
name = "overpass"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "overpass"
path = "src/main.rs"

[[bin]]
name = "overpass-server"
path = "src/bin/server.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
wiremock = "0.6.5"


